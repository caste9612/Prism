[package]
name = "prism-win"
description = "Windows implementations of the Prism platform traits (volumes, MFT, USN, SMART, shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
prism-core.workspace = true
notify.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Data_Xml_Dom",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com_StructuredStorage",
    "UI_Notifications",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[features]
# Tests that need administrator rights; run through the admin runner (docs/TESTING.md §4).
admin-tests = []
# Helpers for the tests of other crates (synthetic video clips).
test-support = []

[lints]
workspace = true
