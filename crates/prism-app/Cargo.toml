[package]
name = "prism-app"
description = "Prism desktop application (Tauri 2): thin commands, events, windows, tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "prism"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
prism-core.workspace = true
prism-win.workspace = true
crossbeam-channel.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs = "12"

[features]
# Set by `tauri build`: serve the embedded frontend instead of the development server.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
