[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["caste9612"]
repository = "https://github.com/caste9612/Prism"
publish = false

[workspace.dependencies]
prism-core = { path = "crates/prism-core" }
prism-win = { path = "crates/prism-win" }

# Shared lints (ADR-0002). Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny" # allowed only in prism-win, where every block needs a SAFETY comment
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = true
codegen-units = 1
